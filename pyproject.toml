[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "silent-authority-tiktok-dataset"
version = "1.0.0"
description = "NVIDIA Silent Authority & Branding Iceberg Research Dataset and Analytics Hub"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "fast-krippendorff>=0.9.0",
    "pytest>=8.0.0"
]

[tool.poetry]
name = "silent-authority-tiktok-dataset"
version = "1.0.0"
description = "NVIDIA Silent Authority & Branding Iceberg Research Dataset and Analytics Hub"
authors = ["Indri Anjar Kartika Sari <indri.cs2026@ids.ac.id>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
streamlit = ">=1.35.0"
pandas = ">=2.0.0"
plotly = ">=5.18.0"
fast-krippendorff = ">=0.9.0"
